<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tu Tiên Idle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- LOGIN -->
  <section id="login-screen" class="screen">
    <h1>Tu Tiên Thế Giới</h1>
    <input id="username" placeholder="Tài khoản">
    <input id="password" type="password" placeholder="Mật khẩu">
    <button onclick="login()">Đăng nhập / Đăng ký</button>
  </section>

  <!-- CREATE -->
  <section id="create-screen" class="screen hidden">
    <h2>Tạo Nhân Vật</h2>

    <input id="char-name" placeholder="Tên nhân vật">

    <div class="gender">
      <button onclick="selectGender('Nam')">Nam</button>
      <button onclick="selectGender('Nữ')">Nữ</button>
    </div>

    <div id="roll-result" class="panel">
      Chưa roll
    </div>

    <button onclick="rollCharacter()">🎲 Roll</button>
    <button onclick="confirmCharacter()">✔ Xác nhận</button>
  </section>

  <!-- GAME -->
  <section id="game-screen" class="screen hidden">
  <div id="character-header" class="panel">
    <!-- thông tin nhân vật -->
  </div>

    <!-- NHÂN VẬT TU LUYỆN -->
<div class="cultivation-center">
  <img
    src="assets/meditation.png"
    alt="Tu luyện"
    class="cultivation-img"
  />

  <button onclick="toggleCultivation()">🧘 Tu luyện / Dừng</button>
  <button onclick="breakThrough()">⚡ Đột phá</button>
</div>
    <button onclick="openCharacterPanel()">📜 Nhân vật</button>
    <!-- MENU THU GỌN -->
<div class="panel">

  <!-- MAP -->
  <div class="menu-item">
    <button onclick="toggleMenu('map-menu')">🗺 Bản đồ</button>
    <div id="map-menu" class="menu-content hidden">
      <button onclick="goMap(1)">🌿 Linh Sơn</button>
      <button onclick="goMap(2)">🔥 Hỏa Vực</button>
    </div>
  </div>

  <!-- CÔNG PHÁP -->
  <div class="menu-item">
    <button onclick="toggleMenu('method-menu')">📘 Công pháp</button>
    <div id="method-menu" class="menu-content hidden">
      <button onclick="learnCultivationMethod(1)">
        Ngũ Hành Dẫn Khí Quyết
      </button>
      <button onclick="learnCultivationMethod(2)">
        Kim Linh Quyết
      </button>
      <button onclick="learnCultivationMethod(3)">
        Mộc Linh Trường Sinh Công
      </button>
    </div>
  </div>

  <!-- KHÁC -->
  <button onclick="openInventory()">🎒 Kho đồ</button>
  <button onclick="openCharacterPanel()">📜 Nhân vật</button>
  <button onclick="logout()" class="logout-btn">🚪 Đăng xuất</button>

    </div>
  </section>

  <!-- BATTLE -->
  <section id="battle-screen" class="screen hidden">
    <h2>Chiến đấu</h2>
    <div id="battle-log"></div>
    <button onclick="endBattle()">Rút lui</button>
  </section>

  <!-- INVENTORY -->
  <section id="inventory-screen" class="screen hidden">
    <h2>Kho đồ</h2>
    <div id="bagBox">(Chưa có vật phẩm)</div>
    <button onclick="backToGame()">Quay lại</button>
  </section>
<!-- CHARACTER PANEL -->
<section id="character-panel" class="screen hidden">
  <h2>📜 Thông Tin Nhân Vật</h2>

  <div id="character-panel-content" class="panel">
    <!-- render an toàn -->
  </div>
  <button onclick="closeCharacterPanel()">Quay lại</button>
    </section>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
<script src="character.js"></script>
<script src="cultivation.js"></script>
<script src="map.js"></script>
<script src="battle.js"></script>
<script src="inventory.js"></script>
<script src="characterPanel.js"></script>
<script src="characterHeader.js"></script>
<script src="stats.js"></script>
<script src="effects.js"></script>
<script src="cultivationMethod.js"></script>
<script src="ui.js"></script>
</body>
</html>
