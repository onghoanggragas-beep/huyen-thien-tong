<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tu Tiên Idle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
  <body>

<div id="app">

  <!-- LOGIN -->
  <section id="login-screen" class="screen">
    <h1>Tu Tiên Thế Giới</h1>
    <input id="username" placeholder="Tài khoản">
    <input id="password" type="password" placeholder="Mật khẩu">
    <button onclick="login()">Đăng nhập / Đăng ký</button>
  </section>

  <!-- CREATE -->
  <section id="create-screen" class="screen hidden">
    <h2>Tạo Nhân Vật</h2>

    <input id="char-name" placeholder="Tên nhân vật">

    <div class="gender">
      <button onclick="selectGender('Nam')">Nam</button>
      <button onclick="selectGender('Nữ')">Nữ</button>
    </div>

    <div id="roll-result" class="panel">
      Chưa roll
    </div>

    <button onclick="rollCharacter()">🎲 Roll</button>
    <button onclick="confirmCharacter()">✔ Xác nhận</button>
  </section>

  <!-- GAME -->
  <section id="game-screen" class="screen hidden game-ui">

  <!-- HEADER -->
  <div class="top-bar">
    <div class="char-info">
      <div id="char-name-ui">Kira</div>
      <div id="char-realm-ui">Luyện Khí – Tầng 1</div>
    </div>

    <div class="qi-bar">
      <div class="qi-fill" id="qi-fill"></div>
      <span id="qi-text">0 / 100</span>
    </div>
  </div>

  <!-- NHÂN VẬT -->
  <div class="character-area">
    <img src="assets/character.png" class="character-sprite" />
  </div>

  <!-- ICON MENU GIỮA -->
  <div class="floating-menu">
    <button onclick="toggleCultivation()">🧘</button>
    <button onclick="openInventory()">🎒</button>
    <button onclick="openCharacterPanel()">📜</button>
    <button class="icon-btn" onclick="openMapPanel()">
  🗺
    </button>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
  <button onclick="showGame()">🧘<br>Tu luyện</button>
  <button onclick="openMapPanel()">🗺<br>Bản đồ</button>
  <button onclick="openMethodPanel()">📘<br>Công pháp</button>
  <button onclick="logout()">🚪<br>Thoát</button>
  </div>

  </section>

  <!-- BATTLE -->
  <section id="battle-screen" class="screen hidden">
    <h2>Chiến đấu</h2>
    <div id="battle-log"></div>
    <button onclick="endBattle()">Rút lui</button>
  </section>

  <!-- INVENTORY -->
  <section id="inventory-screen" class="screen hidden">
    <h2>Kho đồ</h2>
    <div id="bagBox">(Chưa có vật phẩm)</div>
    <button onclick="backToGame()">Quay lại</button>
  </section>
<!-- CHARACTER PANEL -->
<section id="character-panel" class="screen hidden">
  <h2>📜 Thông Tin Nhân Vật</h2>

  <div id="character-panel-content" class="panel">
    <!-- render an toàn -->
  </div>
  <button onclick="closeCharacterPanel()">Quay lại</button>
    </section>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
<script src="character.js"></script>
<script src="cultivation.js"></script>
<script src="map.js"></script>
<script src="battle.js"></script>
<script src="inventory.js"></script>
<script src="characterPanel.js"></script>
<script src="characterHeader.js"></script>
<script src="stats.js"></script>
<script src="effects.js"></script>
<script src="cultivationMethod.js"></script>
<script src="ui.js"></script>
<!-- MAP PANEL -->
<div id="map-panel" class="modal hidden">
  <div class="modal-box">
    <h3>🗺 Bản đồ</h3>
    <button onclick="goMap(1)">🌿 Linh Sơn</button>
    <button onclick="goMap(2)">🔥 Hỏa Vực</button>
    <button onclick="closeModal()">Đóng</button>
  </div>
</div>

<!-- METHOD PANEL -->
<div id="method-panel" class="modal hidden">
  <div class="modal-box">
    <h3>📘 Công pháp</h3>
    <button onclick="learnCultivationMethod(1)">
      Ngũ Hành Dẫn Khí Quyết
    </button>
    <button onclick="learnCultivationMethod(2)">
      Kim Linh Quyết
    </button>
    <button onclick="closeModal()">Đóng</button>
  </div>
  </body>
</html>
