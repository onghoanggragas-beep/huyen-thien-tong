<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Tu Tiên Idle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<div id="app">

  <!-- ================= LOGIN ================= -->
  <section id="login-screen" class="screen">
    <h1>Tu Tiên Thế Giới</h1>
    <input id="username" placeholder="Tài khoản" />
    <input id="password" type="password" placeholder="Mật khẩu" />
    <button onclick="login()">Đăng nhập / Đăng ký</button>
  </section>

  <!-- ================= CREATE CHARACTER ================= -->
  <section id="create-screen" class="screen hidden">
    <h2>Tạo Nhân Vật</h2>

    <input id="char-name" placeholder="Tên nhân vật" />

    <div class="gender">
      <button onclick="selectGender('Nam')">Nam</button>
      <button onclick="selectGender('Nữ')">Nữ</button>
    </div>

    <div id="roll-result" class="panel">Chưa roll</div>

    <button onclick="rollCharacter()">🎲 Roll</button>
    <button onclick="confirmCharacter()">✔ Xác nhận</button>
  </section>

  <!-- ================= GAME ================= -->
  <section id="game-screen" class="screen hidden game-ui">

    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="char-info">
        <div id="char-name-ui">---</div>
        <div id="char-realm-ui">---</div>
      </div>

      <div class="qi-bar">
        <div class="qi-fill" id="qi-fill"></div>
        <span id="qi-text">0 / 100</span>
      </div>
    </div>

    <!-- CHARACTER -->
    <div class="character-area">
      <img src="assets/character.png" class="character-sprite" />
    </div>

    <!-- ACTION BAR -->
    <div class="action-bar">
      <button onclick="toggleCultivation()">🧘 Tu luyện</button>
      <button id="breakthrough-btn" class="hidden" onclick="breakthrough()">
        ⚡ Đột phá
      </button>
    </div>

  </section>

  <!-- ================= BATTLE ================= -->
  <section id="battle-screen" class="screen hidden battle-ui">

    <div class="battle-field">
      <div class="fighter player" id="player">
        <img src="assets/character.png" />
        <div class="hp-bar">
          <div id="player-hp"></div>
        </div>
      </div>

      <div class="fighter enemy" id="enemy">
        <img src="assets/enemy.png" />
        <div class="hp-bar">
          <div id="enemy-hp"></div>
        </div>
      </div>
    </div>

    <div id="battle-log" class="panel"></div>

    <div class="battle-actions">
      <button onclick="playerAttack()">⚔️ Đánh thường</button>
      <button onclick="playerSkill()">🔥 Võ kỹ</button>
      <button onclick="endBattle()">❌ Rút lui</button>
    </div>

  </section>

  <!-- ================= INVENTORY ================= -->
  <section id="inventory-screen" class="screen hidden">
    <h2>🎒 Kho đồ</h2>
    <div id="bagBox">(Chưa có vật phẩm)</div>
    <button onclick="showGame()">Quay lại</button>
  </section>

  <!-- ================= CHARACTER PANEL ================= -->
  <section id="character-panel" class="screen hidden">
    <h2>📜 Thông Tin Nhân Vật</h2>
    <div id="character-panel-content" class="panel"></div>
    <button onclick="showGame()">Quay lại</button>
  </section>

</div>

<!-- ================= BOTTOM BAR ================= -->
<div class="bottom-bar">
  <button onclick="showGame()">🧘<br>Tu luyện</button>
  <button onclick="openMapPanel()">🗺<br>Bản đồ</button>
  <button onclick="openMethodPanel()">📘<br>Công pháp</button>
  <button onclick="logout()">🚪<br>Thoát</button>
</div>

<!-- ================= MAP PANEL ================= -->
<div id="map-panel" class="modal hidden">
  <div class="modal-box">
    <h3>🗺 Bản đồ</h3>
    <button onclick="confirmEnterMap(1)">🌿 Linh Sơn</button>
    <button onclick="confirmEnterMap(2)">🔥 Hỏa Vực</button>
    <button onclick="confirmEnterMap(3)">❄️ Băng Nguyên</button>
    <button onclick="closeModal()">Đóng</button>
  </div>
</div>

<!-- ================= MAP CONFIRM ================= -->
<div id="map-confirm-panel" class="modal hidden">
  <div class="modal-box">
    <h3 id="map-name"></h3>
    <p id="map-desc"></p>
    <p><b>Nguy hiểm:</b> <span id="map-danger"></span></p>
    <button id="enter-map-btn">⚔️ Tiến vào</button>
    <button onclick="closeModal()">❌ Rút lui</button>
  </div>
</div>

<!-- ================= METHOD PANEL ================= -->
<div id="method-panel" class="modal hidden">
  <div class="modal-box">
    <h3>📘 Công pháp</h3>
    <button onclick="learnCultivationMethod(1)">
      Ngũ Hành Dẫn Khí Quyết
    </button>
    <button onclick="learnCultivationMethod(2)">
      Kim Linh Quyết
    </button>
    <button onclick="closeModal()">Đóng</button>
  </div>
</div>

<!-- ================= SCRIPT LOAD ORDER (RẤT QUAN TRỌNG) ================= -->
<script src="data.js"></script>
<script src="game.js"></script>
<script src="character.js"></script>
<script src="cultivation.js"></script>
<script src="battle.js"></script>
<script src="map.js"></script>
<script src="inventory.js"></script>
<script src="characterPanel.js"></script>
<script src="characterHeader.js"></script>
<script src="stats.js"></script>
<script src="effects.js"></script>
<script src="cultivationMethod.js"></script>
<script src="ui.js"></script>

</body>
                       </html>
